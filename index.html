<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffcc00">
  <title>MTN Super App Demo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body,div,span,p,button,input{font-family:'Segoe UI',Tahoma,Arial,sans-serif}

/* الأساسيات: السماح بالتمرير الخارجي فقط على الكمبيوتر عند الحاجة */
html, body {
  min-height: 100%;
  background: #fffdf2;
  -webkit-text-size-adjust: 100%;
}

.wrap{direction:rtl;background:#eef0f5;min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;}

/* تصميم إطار الهاتف على الكمبيوتر */
.phone{width:375px;height:780px;background:#f5f5f7;border-radius:44px;border:10px solid #1a1a2e;overflow:hidden;box-shadow:0 0 0 2px #2a2a3e;display:flex;flex-direction:column}
.statusbar{background:#1B3FA0;padding:12px 20px 6px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.statusbar span{color:#fff;font-size:11px;font-weight:600}

/* الشاشات تأخذ الارتفاع الداخلي المتاح بالكامل */
.screen{display:none;flex-direction:column;height:100%;background:#f5f5f7;overflow:hidden}
.screen.on{display:flex}

/* منطقة المحتوى القابلة للتمرير بسلاسة فائقة وبإصبع واحد */
.scr-body{flex:1;overflow-y:auto;padding-bottom:20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scr-body::-webkit-scrollbar{display:none}

/* شريط التنقل السفلي الثابت */
.bot-nav{background:#fff;display:flex;justify-content:space-around;padding:10px 4px 14px;border-top:0.5px solid #e5e5ea;flex-shrink:0}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:52px;padding:2px 0; -webkit-tap-highlight-color: transparent;}
.nav-i span{font-size:9px;color:#aaa}
.nav-i span.a{color:#1B3FA0;font-weight:700}
.nav-ico{font-size:20px;color:#bbb}
.nav-ico.a{color:#1B3FA0}

/* HEADERS */
.hdr{padding:14px 16px 20px;color:#ffffff;flex-shrink:0}
.hdr-blue{background:#1B3FA0}
.hdr-green{background:#0B5E3F}
.hdr-dark{background:#0d0d1a}
.hdr-purple{background:#4c1d95}
.hdr-gold{background:#78350f}
.hdr-indigo{background:#1e1b4b}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hdr-title{font-size:16px;font-weight:700}
.back-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
.notif-circle{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:16px;position:relative}
.notif-dot{width:7px;height:7px;border-radius:50%;background:#ff6b35;position:absolute;top:4px;right:4px;border:1.5px solid #1B3FA0}

/* BALANCE CARD */
.bal-card{background:rgba(255,255,255,0.15);border-radius:14px;padding:12px 14px;border:1px solid rgba(255,255,255,0.2)}
.bal-lbl{font-size:11px;opacity:.8;margin-bottom:3px}
.bal-row{display:flex;justify-content:space-between;align-items:flex-end}
.bal-amt{font-size:26px;font-weight:700}
.bal-cur{font-size:12px;opacity:.75;margin-bottom:2px}
.phone-badge{background:rgba(255,255,255,0.2);padding:3px 9px;border-radius:20px;font-size:11px;display:flex;align-items:center;gap:4px}

/* POINTS BAR */
.pts-bar{background:rgba(255,255,255,0.12);border-radius:12px;padding:10px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.pts-left{font-size:11px;opacity:.8}
.pts-val{font-size:18px;font-weight:700}
.pts-right{font-size:10px;opacity:.75;text-align:left}
.pts-prog-bg{width:80px;height:5px;background:rgba(255,255,255,0.2);border-radius:5px;margin-top:4px}
.pts-prog-fill{height:100%;border-radius:5px;background:#fbbf24}

/* QUICK ACTIONS */
.qa-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 12px 4px}
.qa-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;-webkit-tap-highlight-color: transparent;}
.qa-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px}
.qa-lbl{font-size:10px;color:#555;text-align:center;font-weight:500}

/* SECTIONS */
.sec-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 6px}
.sec-title{font-size:14px;font-weight:700
